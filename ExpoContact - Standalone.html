document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 6 L18 18 M18 6 L6 18\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <span class=\"modal__eyebrow\">Заявка · 30 секунд<\u002Fspan>\n    <h3 class=\"modal__title\" id=\"quickModalTitle\">Обсудим проект<\u002Fh3>\n    <p class=\"modal__sub\">Перезвоним в течение 30 минут в рабочее время.<\u002Fp>\n\n    <form class=\"modal__form\" id=\"quickForm\" novalidate=\"\">\n      <div class=\"field\">\n        <label>Имя <span class=\"req\">*<\u002Fspan><\u002Flabel>\n        <input type=\"text\" name=\"name\" required=\"\" placeholder=\"Напишите имя\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>Компания<\u002Flabel>\n        <input type=\"text\" name=\"company\" placeholder=\"Напишите название\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>Телефон <span class=\"req\">*<\u002Fspan><\u002Flabel>\n        <input type=\"tel\" name=\"phone\" required=\"\" placeholder=\"Напишите номер\">\n      <\u002Fdiv>\n\n      <button type=\"submit\" class=\"btn-submit magnetic\" data-hover=\"\">\n        <span class=\"btn-submit__label\">Отправить заявку<\u002Fspan>\n        <span class=\"btn-submit__circle\" aria-hidden=\"true\">\n          <svg class=\"a1\" viewBox=\"0 0 22 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M1 6 H20 M15 1 L20 6 L15 11\"><\u002Fpath><\u002Fsvg>\n          <svg class=\"a2\" viewBox=\"0 0 22 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M1 6 H20 M15 1 L20 6 L15 11\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/* ─────────────────────────────────────────────────────────────\n   PREFERS-REDUCED-MOTION\n   ───────────────────────────────────────────────────────────── */\nconst REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ─────────────────────────────────────────────────────────────\n   1. CUSTOM CURSOR (dot + lerp ring)\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  if (window.innerWidth < 900) return;\n  const dot = document.getElementById('cursorDot');\n  const ring = document.getElementById('cursorRing');\n  let mx = window.innerWidth/2, my = window.innerHeight/2;\n  let rx = mx, ry = my;\n  window.addEventListener('mousemove', (e)=>{ mx=e.clientX; my=e.clientY; dot.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`; });\n  function loop(){\n    rx += (mx - rx) * 0.15;\n    ry += (my - ry) * 0.15;\n    ring.style.transform = `translate(${rx}px,${ry}px) translate(-50%,-50%)`;\n    requestAnimationFrame(loop);\n  }\n  loop();\n  document.querySelectorAll('a, button, [data-hover]').forEach(el => {\n    el.addEventListener('mouseenter', ()=> ring.classList.add('is-hover'));\n    el.addEventListener('mouseleave', ()=> ring.classList.remove('is-hover'));\n  });\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   2. SCROLL PROGRESS\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const bar = document.getElementById('scanBar');\n  function tick(){\n    const h = document.documentElement;\n    const max = h.scrollHeight - window.innerHeight;\n    const pct = max > 0 ? (h.scrollTop / max) : 0;\n    bar.style.width = (pct*100).toFixed(2)+'%';\n  }\n  window.addEventListener('scroll', tick, {passive:true});\n  tick();\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   3. NAV state on scroll\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const nav = document.getElementById('nav');\n  window.addEventListener('scroll', ()=>{\n    nav.classList.toggle('is-scrolled', window.scrollY > 60);\n  }, {passive:true});\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   4. HERO — 3D logo (Three.js, extruded SVG)\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const mount = document.getElementById('logo3d');\n  if (!mount) return;\n\n  // Load Three.js + SVGLoader from CDN\n  function loadScript(src){\n    return new Promise((res, rej) => {\n      const s = document.createElement('script');\n      s.src = src; s.onload = res; s.onerror = rej;\n      document.head.appendChild(s);\n    });\n  }\n\n  (async () => {\n    await loadScript('https://unpkg.com/three@0.137.0/build/three.min.js');\n    await loadScript('https://unpkg.com/three@0.137.0/examples/js/loaders/SVGLoader.js');\n\n    const THREE = window.THREE;\n    const w = () => mount.clientWidth;\n    const h = () => mount.clientHeight;\n\n    const scene = new THREE.Scene();\n    scene.background = null;\n\n    const camera = new THREE.PerspectiveCamera(35, w()/h(), 0.1, 2000);\n    camera.position.set(0, 0, 900);\n\n    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n    renderer.setSize(w(), h());\n    if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace || 'srgb';\n    if ('outputEncoding' in renderer && THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;\n    if (THREE.ACESFilmicToneMapping) renderer.toneMapping = THREE.ACESFilmicToneMapping;\n    renderer.toneMappingExposure = 1.25;\n    mount.appendChild(renderer.domElement);\n\n    // Lights — gold/orange rim setup\n    scene.add(new THREE.AmbientLight(0xffffff, 0.25));\n\n    const key = new THREE.DirectionalLight(0xffaa55, 3.2);\n    key.position.set(160, 120, 220);\n    scene.add(key);\n\n    const rim = new THREE.DirectionalLight(0xff5a14, 4.0);\n    rim.position.set(-180, 60, -120);\n    scene.add(rim);\n\n    const fill = new THREE.PointLight(0xff8a30, 2.5, 800);\n    fill.position.set(0, 0, 300);\n    scene.add(fill);\n\n    const back = new THREE.PointLight(0xffd9a0, 1.5, 600);\n    back.position.set(0, 200, -200);\n    scene.add(back);\n\n    // Build logo group from SVG\n    const group = new THREE.Group();\n    scene.add(group);\n\n    const goldMat = new THREE.MeshStandardMaterial({\n      color: 0xE8651C,\n      metalness: 0.95,\n      roughness: 0.22,\n      emissive: 0x451004,\n      emissiveIntensity: 0.35,\n    });\n\n    const loader = new THREE.SVGLoader();\n    loader.load(window.__resources.logoSvg, (data) => {\n      const paths = data.paths;\n      const all = new THREE.Group();\n      paths.forEach((path) => {\n        const shapes = (THREE.SVGLoader.createShapes ? THREE.SVGLoader.createShapes(path) : path.toShapes(true));\n        shapes.forEach((shape) => {\n          const geom = new THREE.ExtrudeGeometry(shape, {\n            depth: 40,\n            bevelEnabled: true,\n            bevelThickness: 5,\n            bevelSize: 3,\n            bevelOffset: 0,\n            bevelSegments: 5,\n            curveSegments: 32,\n          });\n          const mesh = new THREE.Mesh(geom, goldMat);\n          all.add(mesh);\n        });\n      });\n      // Center geometry: SVG y-axis is flipped, viewBox is 297.67x297.67\n      all.scale.y = -1;\n      all.position.x = -297.67 / 2;\n      all.position.y =  297.67 / 2;\n\n      // Wrap so the group rotates around (0,0,0)\n      const wrap = new THREE.Group();\n      wrap.add(all);\n      group.add(wrap);\n\n      // Scale to fit viewport\n      const fit = () => {\n        const target = Math.min(w(), h()) * 0.5;\n        const s = target / 297.67 * 0.7;\n        group.scale.setScalar(s);\n      };\n      fit();\n      window.addEventListener('resize', fit);\n    });\n\n    // Drag rotation + auto-spin\n    let isDragging = false;\n    let pX = 0, pY = 0;\n    let targetRY = 0, targetRX = -0.15;\n    let curRY = 0, curRX = -0.15;\n    let lastMoveAt = 0;\n    let autoSpin = true;\n\n    mount.addEventListener('pointerdown', (e) => {\n      isDragging = true;\n      pX = e.clientX; pY = e.clientY;\n      autoSpin = false;\n      mount.setPointerCapture(e.pointerId);\n    });\n    window.addEventListener('pointermove', (e) => {\n      if (!isDragging) return;\n      const dx = e.clientX - pX;\n      const dy = e.clientY - pY;\n      pX = e.clientX; pY = e.clientY;\n      targetRY += dx * 0.012;\n      targetRX += dy * 0.008;\n      targetRX = Math.max(-0.9, Math.min(0.9, targetRX));\n      lastMoveAt = performance.now();\n    });\n    window.addEventListener('pointerup', () => {\n      isDragging = false;\n      // resume auto-spin after idle\n      setTimeout(() => { if (performance.now() - lastMoveAt > 1400) autoSpin = true; }, 1500);\n    });\n\n    // resize\n    window.addEventListener('resize', () => {\n      camera.aspect = w()/h();\n      camera.updateProjectionMatrix();\n      renderer.setSize(w(), h());\n    });\n\n    // animate\n    function loop(){\n      requestAnimationFrame(loop);\n      if (autoSpin) targetRY += 0.004;\n      curRY += (targetRY - curRY) * 0.10;\n      curRX += (targetRX - curRX) * 0.10;\n      group.rotation.y = curRY;\n      group.rotation.x = curRX;\n      renderer.render(scene, camera);\n    }\n    loop();\n  })().catch(err => console.warn('3D logo failed:', err));\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   6. MARQUEE — build content (duplicated for seamless loop)\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const star = `<svg class=\"marquee__star\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M12 0 L14 9 L23 11 L14 13 L12 22 L10 13 L1 11 L10 9 Z\"/><\u002Fsvg>`;\n  const items = [\n    \"20+ лет на рынке\", \"5000+ проектов\", \"3 страны\", \"500+ клиентов\",\n    \"Central Asia since 2004\", \"Дизайн × Производство × Монтаж\", \"Tashkent · Almaty · Dubai\"\n  ];\n  const trackHTML = items.map(t => `<span class=\"marquee__item\"><span>${t}<\u002Fspan>${star}<\u002Fspan>`).join('');\n  document.getElementById('mqA').innerHTML = trackHTML + trackHTML;\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   7. COUNTERS — animate on intersect\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const items = document.querySelectorAll('.counter');\n  const io = new IntersectionObserver(entries => {\n    entries.forEach(e => {\n      if (!e.isIntersecting) return;\n      e.target.classList.add('is-in');\n      const target = +e.target.dataset.target;\n      const valEl = e.target.querySelector('.counter__val');\n      const dur = 1600; const t0 = performance.now();\n      const fmt = n => target>=1000 ? Math.round(n).toLocaleString('ru-RU') : Math.round(n);\n      function step(now){\n        const k = Math.min(1, (now-t0)/dur);\n        const eased = 1 - Math.pow(1-k, 3);\n        valEl.textContent = fmt(target * eased);\n        if (k<1) requestAnimationFrame(step);\n      }\n      requestAnimationFrame(step);\n      io.unobserve(e.target);\n    });\n  }, { threshold:.4 });\n  items.forEach(i => io.observe(i));\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   8. SERVICES — render + accordion\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const data = [\n    { t:\"Проектирование и 3D-визуализация\", d:\"Концепция стенда, эргономика потока посетителей, фотореалистичный 3D-рендер ещё до первого среза. Утверждаем картинку — не сюрприз на монтаже.\",\n      inc:[\"Концепт-эскизы\", \"3D-модель + рендеры\", \"Чертежи КМ/КМД\", \"Согласование с площадкой\"],\n      img:\"https://picsum.photos/seed/svc1/520/340\" },\n    { t:\"Производство стендов\", d:\"Собственный цех 1200 м² в Ташкенте: ЧПУ-фрезеровка, покраска, печать, металлоконструкции. От уникальных эксклюзивов до серийных модульных систем.\",\n      inc:[\"МДФ, металл, акрил\", \"Широкоформатная печать\", \"Подсветка, AV-техника\", \"Контроль на всех этапах\"],\n      img:\"https://picsum.photos/seed/svc2/520/340\" },\n    { t:\"Монтаж и демонтаж\", d:\"Бригады с допусками к работе на ведущих площадках Узбекистана и Казахстана. Монтаж под ключ за 24–72 часа, демонтаж — за ночь.\",\n      inc:[\"UzExpoCentre · CAEx\", \"Аtakent · Almaty Expo\", \"Логистика и страховка\", \"Хранение между выставками\"],\n      img:\"https://picsum.photos/seed/svc3/520/340\" },\n    { t:\"Аренда модульных решений\", d:\"Octanorm, Maxima, T3 — для тех, кому нужно быстро и без вложений. Хранение, монтаж и адаптивная графика входят в стоимость.\",\n      inc:[\"Октанорм, T3, Maxima\", \"Адаптация графики\", \"Аренда от 6 м²\", \"Хранение между датами\"],\n      img:\"https://picsum.photos/seed/svc4/520/340\" },\n    { t:\"Сопровождение на выставке\", d:\"Дежурный технический менеджер, замена графики, мелкий ремонт, перенастройка AV. Стенд работает все дни выставки, не только в первый.\",\n      inc:[\"24/7 на площадке\", \"Запас расходников\", \"AV-инженер\", \"Reporting каждый день\"],\n      img:\"https://picsum.photos/seed/svc5/520/340\" },\n    { t:\"Брендинг площадки и POSM\", d:\"От вывески у входа до брендирования зон отдыха. Если на стенде висит ваш логотип — пусть он висит и на пути к нему.\",\n      inc:[\"Вывески, баннеры\", \"Брендирование транспорта\", \"POSM, мерч\", \"Roll-up, press-wall\"],\n      img:\"https://picsum.photos/seed/svc6/520/340\" }\n  ];\n  const list = document.getElementById('svcList');\n  list.innerHTML = data.map((s, i) => `\n    <div class=\"svc-item\" data-svc>\n      <div class=\"svc-item__num\">/${String(i+1).padStart(2,'0')}<\u002Fdiv>\n      <div class=\"svc-item__title\">${s.t}<\u002Fdiv>\n      <div class=\"svc-item__preview\" style=\"background-image:url('${s.img}');\"><\u002Fdiv>\n      <div class=\"svc-item__toggle\" data-hover><\u002Fdiv>\n      <div class=\"svc-item__body\">\n        <div class=\"svc-item__body-inner\">\n          <div><\u002Fdiv>\n          <p>${s.d}<\u002Fp>\n          <ul class=\"svc-item__includes\">${s.inc.map(x=>`<li>${x}<\u002Fli>`).join('')}<\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n  list.querySelectorAll('[data-svc]').forEach(item => {\n    item.addEventListener('click', (e)=>{\n      if (e.target.closest('.svc-item__body')) return;\n      item.classList.toggle('is-open');\n    });\n  });\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   9. PORTFOLIO — render bento + reveal + filter\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const data = [\n    { t:\"Silk Road Motors\", e:\"Auto Expo Tashkent\", sqm:\"240\", cls:\"large\", img:\"folio1\", size:\"card--xl\" },\n    { t:\"Alif Bank · Future Stage\",  e:\"Innoprom CA\",      sqm:\"96\",  cls:\"large conf\", img:\"folio2\", size:\"card--lg\" },\n    { t:\"UzAuto\",            e:\"AutoExpo Almaty\",  sqm:\"180\", cls:\"large intl\", img:\"folio3\", size:\"card--md\" },\n    { t:\"Perfectum\",         e:\"ICT Week\",         sqm:\"54\",  cls:\"modular conf\", img:\"folio4\", size:\"card--sm\" },\n    { t:\"Tourism Committee\", e:\"WTM London\",       sqm:\"120\", cls:\"intl conf\",  img:\"folio5\", size:\"card--sm\" },\n    { t:\"UzBuild · Hall A\",  e:\"UzBuild 2025\",     sqm:\"72\",  cls:\"modular\",    img:\"folio6\", size:\"card--wd\" },\n    { t:\"Beeline B2B\",       e:\"Telecom Forum\",    sqm:\"36\",  cls:\"modular conf\", img:\"folio7\", size:\"card--nr\" },\n    { t:\"Uzpharm Pavilion\",  e:\"CIPhI Shanghai\",   sqm:\"144\", cls:\"large intl\", img:\"folio8\", size:\"card--md\" },\n    { t:\"Humans IT\",         e:\"GITEX Dubai\",      sqm:\"48\",  cls:\"modular intl\", img:\"folio9\", size:\"card--sm\" }\n  ];\n  const bento = document.getElementById('bento');\n  bento.innerHTML = data.map((p,i) => `\n    <article class=\"card ${p.size}\" data-cls=\"${p.cls}\">\n      <div class=\"card__img\" style=\"background-image:url('https://picsum.photos/seed/${p.img}/900/600');\"><\u002Fdiv>\n      <div class=\"card__shade\"><\u002Fdiv>\n      <span class=\"card__sub\">/${String(i+1).padStart(2,'0')} · ${p.e}<\u002Fspan>\n      <div class=\"card__rule\"><\u002Fdiv>\n      <div class=\"card__meta\">\n        <h3 class=\"card__title\">${p.t}<\u002Fh3>\n        <\u002Fdiv>\n      <div class=\"card__reveal\"><\u002Fdiv>\n    <\u002Farticle>\n  `).join('');\n\n  // reveal\n  const io = new IntersectionObserver(es => {\n    es.forEach(e => {\n      if (e.isIntersecting){ e.target.classList.add('is-in'); io.unobserve(e.target); }\n    });\n  }, { threshold:.15 });\n  bento.querySelectorAll('.card').forEach(c => io.observe(c));\n\n  // filters\n  document.querySelectorAll('#filters .filter').forEach(btn => {\n    btn.addEventListener('click', ()=>{\n      document.querySelectorAll('#filters .filter').forEach(b => b.classList.remove('is-active'));\n      btn.classList.add('is-active');\n      const f = btn.dataset.filter;\n      bento.querySelectorAll('.card').forEach(c => {\n        const ok = f==='all' || (c.dataset.cls||'').split(' ').includes(f);\n        c.style.display = ok ? '' : 'none';\n      });\n    });\n  });\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   10. PROCESS — sticky horizontal scroll\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const steps = [\n    { n:\"01\", l:\"Бриф\", t:\"Встреча и бриф\", d:\"Слушаем задачу, выставку, бюджет и KPI. Не продаём — задаём правильные вопросы. На выходе — техзадание на двух страницах.\", dur:\"1–2 дня\",\n      svg:`<svg viewBox=\"0 0 200 200\"><rect class=\"accent\" x=\"30\" y=\"30\" width=\"120\" height=\"160\"/><path d=\"M50 70 H130 M50 90 H130 M50 110 H110 M50 130 H120\"/><circle cx=\"150\" cy=\"40\" r=\"14\" class=\"accent\"/><\u002Fsvg>` },\n    { n:\"02\", l:\"3D-концепция\", t:\"3D-концепция\", d:\"Эскизы → 3D-модель → фотореалистичный рендер. Вы видите стенд под разными ракурсами до того, как будет куплен первый лист МДФ.\", dur:\"3–5 дней\",\n      svg:`<svg viewBox=\"0 0 200 200\"><path d=\"M30 130 L100 90 L170 130 L100 170 Z\"/><path d=\"M100 90 V40\"/><path d=\"M70 110 L130 110 L130 150 L70 150 Z\" class=\"accent\"/><circle cx=\"100\" cy=\"40\" r=\"6\"/><\u002Fsvg>` },\n    { n:\"03\", l:\"Согласование\", t:\"Согласование\", d:\"С вашей маркетинг-командой и организатором выставки. Чертежи КМ/КМД, паспорта безопасности, нагрузки на пол.\", dur:\"2–4 дня\",\n      svg:`<svg viewBox=\"0 0 200 200\"><circle cx=\"100\" cy=\"100\" r=\"60\"/><path d=\"M75 100 L93 118 L130 80\" class=\"accent\"/><\u002Fsvg>` },\n    { n:\"04\", l:\"Производство\", t:\"Производство\", d:\"Собственный цех 1200 м² в Ташкенте. ЧПУ, покраска, печать, металл. Каждый этап — фото в чат.\", dur:\"7–14 дней\",\n      svg:`<svg viewBox=\"0 0 200 200\"><rect x=\"20\" y=\"100\" width=\"160\" height=\"70\" class=\"accent\"/><rect x=\"40\" y=\"60\" width=\"40\" height=\"40\"/><rect x=\"100\" y=\"40\" width=\"60\" height=\"60\"/><path d=\"M30 170 L30 185 M170 170 L170 185 M100 170 L100 185\"/><\u002Fsvg>` },\n    { n:\"05\", l:\"Доставка\", t:\"Логистика\", d:\"Транспортная команда возит по Узбекистану, Казахстану и в международные хабы. Страховка, температурный режим, такелаж.\", dur:\"1–3 дня\",\n      svg:`<svg viewBox=\"0 0 200 200\"><rect x=\"20\" y=\"70\" width=\"100\" height=\"60\"/><path d=\"M120 90 H160 L180 110 V130 H120 Z\" class=\"accent\"/><circle cx=\"55\" cy=\"140\" r=\"14\"/><circle cx=\"155\" cy=\"140\" r=\"14\"/><\u002Fsvg>` },\n    { n:\"06\", l:\"Монтаж\", t:\"Монтаж под ключ\", d:\"Бригады с допусками к UzExpoCentre, Atakent, CAEx, DWTC. Сборка 24–72 часа, AV-настройка, тестовый прогон.\", dur:\"1–3 дня\",\n      svg:`<svg viewBox=\"0 0 200 200\"><path d=\"M40 170 L40 80 L100 50 L160 80 L160 170\"/><path d=\"M70 170 V120 H130 V170\" class=\"accent\"/><path d=\"M40 80 L160 80\"/><\u002Fsvg>` },\n    { n:\"07\", l:\"Демонтаж\", t:\"Демонтаж и хранение\", d:\"Разбираем за ночь, упаковываем, отвозим на хранение. Многоразовые элементы вернутся на следующую выставку.\", dur:\"1 ночь\",\n      svg:`<svg viewBox=\"0 0 200 200\"><path d=\"M30 100 H170\" class=\"accent\"/><path d=\"M50 100 L50 60 L150 60 L150 100\" stroke-dasharray=\"4 4\"/><rect x=\"40\" y=\"120\" width=\"120\" height=\"40\"/><\u002Fsvg>` }\n  ];\n  const track = document.getElementById('procTrack');\n  track.innerHTML = steps.map(s => `\n    <article class=\"proc-step\">\n      <div class=\"proc-step__num\" aria-hidden=\"true\">${s.n}<\u002Fdiv>\n      <div class=\"proc-step__body\">\n        <div class=\"proc-step__label\">/${s.n} — ${s.l}<\u002Fdiv>\n        <h3 class=\"proc-step__title\">${s.t}<\u002Fh3>\n        <p class=\"proc-step__desc\">${s.d}<\u002Fp>\n        <div class=\"proc-step__dur\">${s.dur}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proc-step__icon\">${s.svg}<\u002Fdiv>\n    <\u002Farticle>\n  `).join('');\n\n  if (window.innerWidth < 900) return; // mobile = vertical stack\n\n  const pin = document.querySelector('.process__pin');\n  const indicator = document.getElementById('procIndicator');\n  const bar = document.getElementById('procBar');\n  const pct = document.getElementById('procPct');\n  function onScroll(){\n    const r = pin.getBoundingClientRect();\n    const total = pin.offsetHeight - window.innerHeight;\n    const scrolled = Math.min(Math.max(-r.top, 0), total);\n    const k = total>0 ? scrolled/total : 0;\n    const distance = (steps.length - 1) * window.innerWidth;\n    track.style.transform = `translateX(${-k * distance}px)`;\n    const idx = Math.min(steps.length-1, Math.floor(k * steps.length));\n    indicator.textContent = `Шаг ${String(idx+1).padStart(2,'0')} / 07`;\n    const fillPct = Math.round(k*100);\n    bar.style.width = (10 + k*86)+'%';\n    pct.textContent = fillPct+'%';\n  }\n  window.addEventListener('scroll', onScroll, {passive:true});\n  window.addEventListener('resize', onScroll);\n  onScroll();\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   11. CLIENTS — marquee\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const A = [\n    { n:\"Silk Road Motors\", m:\"diamond\" },\n    { n:\"Alif Bank\", m:\"circle\" },\n    { n:\"UzAuto\", m:\"\" },\n    { n:\"Perfectum\", m:\"dot\" },\n    { n:\"UZB · Tourism\", m:\"diamond\" },\n    { n:\"Humans IT\", m:\"circle\" },\n    { n:\"Beeline B2B\", m:\"\" },\n    { n:\"Uzpharm\", m:\"dot\" },\n    { n:\"Korzinka\", m:\"diamond\" },\n    { n:\"Asia Alliance\", m:\"\" },\n  ];\n  const B = [\n    { n:\"Uztelecom\", m:\"\" },\n    { n:\"Hyundai UZ\", m:\"circle\" },\n    { n:\"BYD\", m:\"diamond\" },\n    { n:\"NBU\", m:\"dot\" },\n    { n:\"Akfa\", m:\"\" },\n    { n:\"TBC Bank\", m:\"circle\" },\n    { n:\"Ipoteka Bank\", m:\"\" },\n    { n:\"Asaka Bank\", m:\"diamond\" },\n    { n:\"Air Samarkand\", m:\"dot\" },\n    { n:\"Kapital Bank\", m:\"\" }\n  ];\n  const html = arr => arr.map(c => `<span class=\"client-logo\" data-hover><span class=\"client-logo__mark ${c.m}\"><\u002Fspan>${c.n}<\u002Fspan>`).join('');\n  document.getElementById('clientsA').innerHTML = html(A)+html(A);\n  document.getElementById('clientsB').innerHTML = html(B)+html(B);\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   12. FORM — tag pills + submit\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  document.querySelectorAll('.form .tags').forEach(group => {\n    group.querySelectorAll('.tag').forEach(btn => {\n      btn.addEventListener('click', () => {\n        group.querySelectorAll('.tag').forEach(b => b.classList.remove('is-active'));\n        btn.classList.add('is-active');\n      });\n    });\n  });\n\n  const form = document.getElementById('leadForm');\n  if (!form) return;\n  form.addEventListener('submit', (e) => {\n    e.preventDefault();\n    if (!form.checkValidity()) { form.reportValidity(); return; }\n    form.classList.add('is-sent');\n    const btn = form.querySelector('.btn-submit');\n    btn.classList.add('is-sent');\n    btn.querySelector('.btn-submit__label').textContent = 'Заявка отправлена';\n  });\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   13. FAQ\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const data = [\n    { q:\"Сколько стоит выставочный стенд?\", a:\"От $1500 (модульный 6 м²) до $500k+ (эксклюзивный двухэтажный 200+ м²). Средний чек по нашим проектам — $25–60k. На бесплатной консультации мы за 30 минут даём вилку под вашу площадь и амбицию.\" },\n    { q:\"За сколько вы успеете построить стенд?\", a:\"Эксклюзивный — от 14 рабочих дней с момента утверждения концепции. Модульный — от 5 дней. Срочные задачи (выставка через неделю) — берём только если уверены, что сделаем без потери качества.\" },\n    { q:\"Работаете ли вы за пределами Узбекистана?\", a:\"Да. Регулярно работаем в Казахстане, ОАЭ, Турции, Китае, Великобритании и Германии. Возим компоненты или производим локально через проверенных партнёров — что эффективнее для конкретного проекта.\" },\n    { q:\"Можно ли использовать стенд несколько раз?\", a:\"Да, и мы это поощряем. Модульные системы (Octanorm, T3) рассчитаны на 10+ сборок. Эксклюзивные — проектируем с учётом возможной адаптации под следующую выставку и храним между датами.\" },\n    { q:\"Что входит в стоимость?\", a:\"Дизайн, чертежи, согласования, производство, доставка, монтаж, демонтаж, страховка, ответственный менеджер 24/7 на площадке. Никаких «по ходу выяснилось, что доплата за…» — фикс на старте.\" },\n    { q:\"Как начать работу?\", a:\"Отправьте заявку или позвоните — за 24 часа мы выезжаем на встречу (в Ташкенте) или подключаемся в Zoom. Бриф, рекомендации, вилка по бюджету — бесплатно и без обязательств.\" }\n  ];\n  const list = document.getElementById('faqList');\n  list.innerHTML = data.map((f, i) => `\n    <div class=\"faq-item\" data-faq>\n      <button class=\"faq-item__head\" data-hover>\n        <span class=\"faq-item__num\">/${String(i+1).padStart(2,'0')}<\u002Fspan>\n        <span class=\"faq-item__q\">${f.q}<\u002Fspan>\n        <span class=\"faq-item__plus\"><\u002Fspan>\n      <\u002Fbutton>\n      <div class=\"faq-item__body\"><div class=\"faq-item__body-inner\">${f.a}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n  list.querySelectorAll('[data-faq]').forEach(item => {\n    item.querySelector('.faq-item__head').addEventListener('click', () => {\n      const open = item.classList.contains('is-open');\n      list.querySelectorAll('[data-faq]').forEach(x => x.classList.remove('is-open'));\n      if (!open) item.classList.add('is-open');\n    });\n  });\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   13.4 BACK-TO-TOP\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const btn = document.getElementById('toTop');\n  if (!btn) return;\n  function tick(){\n    btn.classList.toggle('is-visible', window.scrollY > window.innerHeight * 0.6);\n  }\n  window.addEventListener('scroll', tick, {passive:true});\n  btn.addEventListener('click', () => {\n    window.scrollTo({ top:0, behavior:'smooth' });\n  });\n  tick();\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   13.5 MODAL — quick request popup\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  const modal = document.getElementById('quickModal');\n  if (!modal) return;\n  let lastFocus = null;\n\n  function open(){\n    lastFocus = document.activeElement;\n    modal.classList.add('is-open');\n    modal.setAttribute('aria-hidden', 'false');\n    document.body.style.overflow = 'hidden';\n    setTimeout(() => modal.querySelector('input[name=\"name\"]')?.focus(), 350);\n  }\n  function close(){\n    modal.classList.remove('is-open');\n    modal.setAttribute('aria-hidden', 'true');\n    document.body.style.overflow = '';\n    lastFocus?.focus?.();\n  }\n\n  document.addEventListener('click', (e) => {\n    const opener = e.target.closest('[data-open-modal]');\n    if (opener){ e.preventDefault(); open(); return; }\n    if (e.target.closest('[data-modal-close]')){ close(); }\n  });\n  document.addEventListener('keydown', (e) => {\n    if (e.key === 'Escape' && modal.classList.contains('is-open')) close();\n  });\n\n  const form = document.getElementById('quickForm');\n  form.addEventListener('submit', (e) => {\n    e.preventDefault();\n    if (!form.checkValidity()) { form.reportValidity(); return; }\n    modal.classList.add('is-sent');\n    const btn = form.querySelector('.btn-submit');\n    btn.classList.add('is-sent');\n    btn.querySelector('.btn-submit__label').textContent = 'Заявка отправлена';\n    setTimeout(() => {\n      close();\n      setTimeout(() => {\n        modal.classList.remove('is-sent');\n        btn.classList.remove('is-sent');\n        btn.querySelector('.btn-submit__label').textContent = 'Отправить заявку';\n        form.reset();\n      }, 500);\n    }, 1800);\n  });\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   14. MAGNETIC BUTTONS\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  if (window.innerWidth < 900) return;\n  document.querySelectorAll('.magnetic').forEach(el => {\n    let rect;\n    el.addEventListener('mouseenter', ()=> rect = el.getBoundingClientRect());\n    el.addEventListener('mousemove', e => {\n      if (!rect) rect = el.getBoundingClientRect();\n      const x = e.clientX - rect.left - rect.width/2;\n      const y = e.clientY - rect.top  - rect.height/2;\n      el.style.transition = 'transform .15s ease-out';\n      el.style.transform = `translate(${x*0.25}px, ${y*0.35}px)`;\n    });\n    el.addEventListener('mouseleave', ()=>{\n      el.style.transition = 'transform .55s cubic-bezier(.2,.7,.2,1)';\n      el.style.transform = '';\n      rect = null;\n    });\n  });\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   15. LANG SWITCH (visual only)\n   ───────────────────────────────────────────────────────────── */\n(() => {\n  document.querySelectorAll('.lang button').forEach(b => {\n    b.addEventListener('click', ()=>{\n      document.querySelectorAll('.lang button').forEach(x => x.classList.remove('is-active'));\n      b.classList.add('is-active');\n    });\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
